[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sdp-reference"
version = "3.0.0"
description = "agent-sdp signed exchange reference profile (alpha implementation)"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
dependencies = ["cryptography==46.0.7", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
include = ["agent_sdp*"]

[tool.setuptools.package-data]
agent_sdp = ["schemas/*.json"]
