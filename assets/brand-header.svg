  <text x="60" y="155" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="800" letter-spacing="-5" fill="#111715">AGENT-SDP404</text>
  <text x="64" y="221" font-family="Arial,Helvetica,sans-serif" font-size="38" letter-spacing="-1" fill="#111715">Data becomes capability.</text>
  <text x="65" y="276" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#4d554e">An independent protocol for agent-mediated exchange.</text>
  <text x="64" y="325" font-family="monospace" font-size="14" letter-spacing="1" fill="#6a706a">PEOPLE · ORGANIZATIONS · RESEARCH · DEVICES · AGENTS</text>
