<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">AGENT-SDP404 — Data becomes capability.</title>
  <desc id="desc">Independent agent exchange protocol. Many data sources converge through an agent and emerge as results and rights. Specification 2.0, reference alpha.</desc>
